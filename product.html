<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0B3D2E" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>ABIT — Produit</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/design-system.css?v=12" />
  <style>
    .gallery { position: relative; background: #F1F4F3; }
    .gallery-main {
      width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #E5EAE8;
    }
    .gallery-ph {
      width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      color: var(--abit-gray-400); font-size: 0.9rem; background: #E5EAE8;
    }
    .thumbs {
      display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto; background: #fff;
      border-bottom: 1px solid var(--abit-gray-100);
    }
    .thumbs img {
      width: 56px; height: 56px; object-fit: cover; border-radius: 8px;
      border: 2px solid transparent; flex-shrink: 0;
    }
    .thumbs img.active { border-color: var(--abit-green); }
    .back-btn {
      position: absolute; top: 12px; left: 12px; z-index: 5;
      width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.95);
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow-sm); font-size: 1.2rem; color: var(--abit-gray-800);
    }
    .price-lg { font-size: 1.5rem; font-weight: 700; color: var(--abit-green); }
    .qty-row {
      display: flex; align-items: center; gap: 12px; margin: var(--space-4) 0;
    }
    .qty-btn {
      width: 40px; height: 40px; border-radius: 10px; border: 1.5px solid var(--abit-gray-200);
      background: #fff; font-size: 1.2rem; font-weight: 600; color: var(--abit-gray-800);
      display: flex; align-items: center; justify-content: center;
    }
    .qty-val {
      min-width: 36px; text-align: center; font-weight: 700; font-size: 1.1rem;
    }
    .sticky-actions {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 90;
      background: #fff; border-top: 1px solid var(--abit-gray-100);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      display: flex; gap: 10px; box-shadow: 0 -4px 16px rgba(0,0,0,0.06);
    }
    .sticky-actions .btn { flex: 1; min-height: 48px; }
    .toast {
      position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
      background: var(--abit-green-dark); color: #fff; padding: 12px 18px;
      border-radius: 12px; font-size: 0.9rem; font-weight: 600; z-index: 200;
      opacity: 0; pointer-events: none; transition: opacity .25s;
      max-width: 90%; text-align: center;
    }
    .toast.show { opacity: 1; }
    .desc { white-space: pre-wrap; color: var(--abit-gray-600); font-size: 0.95rem; line-height: 1.55; }
  </style>
</head>
<body>
  <div class="page-content" style="padding-bottom:100px">
    <div id="loading" style="text-align:center;padding:80px 20px">
      <div class="spinner" style="margin:0 auto"></div>
      <p style="margin-top:12px;color:var(--abit-gray-400);font-size:0.9rem">Chargement…</p>
    </div>

    <div id="error" style="display:none;padding:40px 20px;text-align:center">
      <p style="font-weight:600;margin-bottom:8px">Produit introuvable</p>
      <a href="shop.html" class="btn btn-primary" style="margin-top:16px">Retour boutique</a>
    </div>

    <div id="content" style="display:none">
      <div class="gallery">
        <a href="shop.html" class="back-btn" aria-label="Retour">‹</a>
        <img id="main-img" class="gallery-main" alt="" style="display:none" />
        <div id="main-ph" class="gallery-ph">Sans image</div>
      </div>
      <div class="thumbs" id="thumbs" style="display:none"></div>

      <main class="container" style="padding-top:var(--space-5)">
        <p id="category" style="font-size:0.8rem;color:var(--abit-gray-400);font-weight:600;margin-bottom:6px"></p>
        <h1 id="name" style="font-size:1.35rem;font-weight:700;line-height:1.3;margin-bottom:10px"></h1>
        <div class="price-lg" id="price"></div>
        <p id="delay" style="font-size:0.85rem;color:var(--abit-gray-400);margin-top:8px;display:none"></p>

        <div class="qty-row">
          <span style="font-size:0.9rem;font-weight:600;color:var(--abit-gray-600)">Quantite</span>
          <button type="button" class="qty-btn" id="qty-minus">−</button>
          <span class="qty-val" id="qty">1</span>
          <button type="button" class="qty-btn" id="qty-plus">+</button>
        </div>

        <h2 style="font-size:0.95rem;font-weight:600;margin:var(--space-5) 0 var(--space-2)">Description</h2>
        <p class="desc" id="desc">—</p>
      </main>
    </div>
  </div>

  <div class="sticky-actions" id="actions" style="display:none">
    <a href="cart.html" class="btn btn-outline">Panier</a>
    <button type="button" class="btn btn-primary" id="btn-cart">Ajouter au panier</button>
  </div>

  <div class="toast" id="toast">Ajoute au panier</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDHSNdIiEsg7XlfgRA3YGZuVVNkkJShnXQ",
      authDomain: "abit-d927a.firebaseapp.com",
      projectId: "abit-d927a",
      storageBucket: "abit-d927a.firebasestorage.app",
      messagingSenderId: "254745714667",
      appId: "1:254745714667:web:0ff4451bdd63d680aa03ae",
      measurementId: "G-PXVPKT3M89"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const params = new URLSearchParams(location.search);
    const id = params.get("id");
    let product = null;
    let qty = 1;

    function showToast(msg) {
      var t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(function () { t.classList.remove("show"); }, 1800);
    }

    function getImages(p) {
      var list = [];
      if (p.imageUrls && p.imageUrls.length) list = p.imageUrls.slice();
      else if (p.imageUrl) list = [p.imageUrl];
      return list.filter(Boolean);
    }

    function setMainImage(url) {
      var img = document.getElementById("main-img");
      var ph = document.getElementById("main-ph");
      if (url) {
        img.src = url;
        img.style.display = "block";
        ph.style.display = "none";
      } else {
        img.style.display = "none";
        ph.style.display = "flex";
      }
    }

    function renderGallery(urls) {
      var thumbs = document.getElementById("thumbs");
      thumbs.innerHTML = "";
      if (!urls.length) {
        setMainImage(null);
        thumbs.style.display = "none";
        return;
      }
      setMainImage(urls[0]);
      if (urls.length < 2) {
        thumbs.style.display = "none";
        return;
      }
      thumbs.style.display = "flex";
      urls.forEach(function (url, i) {
        var im = document.createElement("img");
        im.src = url;
        im.alt = "";
        if (i === 0) im.className = "active";
        im.addEventListener("click", function () {
          setMainImage(url);
          thumbs.querySelectorAll("img").forEach(function (x) { x.classList.remove("active"); });
          im.classList.add("active");
        });
        thumbs.appendChild(im);
      });
    }

    function addToCart() {
      if (!product) return;
      var cart = [];
      try { cart = JSON.parse(localStorage.getItem("abit_cart") || "[]"); } catch (e) { cart = []; }
      var imgs = getImages(product);
      var found = cart.find(function (x) { return x.id === product.id; });
      if (found) {
        found.qty = (found.qty || 1) + qty;
      } else {
        cart.push({
          id: product.id,
          name: product.name || "Produit",
          priceXof: product.priceXof || 0,
          imageUrl: imgs[0] || "",
          qty: qty
        });
      }
      localStorage.setItem("abit_cart", JSON.stringify(cart));
      showToast("Ajoute au panier (" + qty + ")");
    }

    document.getElementById("qty-minus").addEventListener("click", function () {
      if (qty > 1) { qty -= 1; document.getElementById("qty").textContent = String(qty); }
    });
    document.getElementById("qty-plus").addEventListener("click", function () {
      qty += 1;
      document.getElementById("qty").textContent = String(qty);
    });
    document.getElementById("btn-cart").addEventListener("click", addToCart);

    async function load() {
      if (!id) {
        document.getElementById("loading").style.display = "none";
        document.getElementById("error").style.display = "block";
        return;
      }
      try {
        var snap = await getDoc(doc(db, "products", id));
        if (!snap.exists()) {
          document.getElementById("loading").style.display = "none";
          document.getElementById("error").style.display = "block";
          return;
        }
        product = { id: snap.id, ...snap.data() };

        document.getElementById("name").textContent = product.name || "Produit";
        document.getElementById("price").textContent =
          product.priceXof != null
            ? Number(product.priceXof).toLocaleString("fr-FR") + " XOF"
            : "-";
        document.getElementById("category").textContent = product.category || "";
        document.getElementById("desc").textContent =
          product.description && String(product.description).trim()
            ? product.description
            : "Aucune description.";

        if (product.deliveryDelay) {
          var d = document.getElementById("delay");
          d.style.display = "block";
          d.textContent = "Delai estime : " + product.deliveryDelay;
        }

        renderGallery(getImages(product));

        document.getElementById("loading").style.display = "none";
        document.getElementById("content").style.display = "block";
        document.getElementById("actions").style.display = "flex";
        document.title = (product.name || "Produit") + " — ABIT";
      } catch (e) {
        console.error(e);
        document.getElementById("loading").style.display = "none";
        document.getElementById("error").style.display = "block";
      }
    }

    load();
  </script>
</body>
</html>
