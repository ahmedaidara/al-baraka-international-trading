<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0B3D2E" />
  <title>ABIT — Suivi</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/design-system.css" />
  <style>
    .step {
      display: flex; gap: 12px; margin-bottom: 4px;
    }
    .step .dot {
      width: 14px; height: 14px; border-radius: 50%; margin-top: 4px; flex-shrink: 0;
      background: var(--abit-gray-200);
    }
    .step.done .dot { background: var(--abit-green); }
    .step.current .dot { background: var(--abit-gold); box-shadow: 0 0 0 4px rgba(201,162,39,0.25); }
    .step .line { width: 2px; flex: 1; background: var(--abit-gray-200); margin: 0 auto; min-height: 16px; }
    .step-col { display: flex; flex-direction: column; align-items: center; }
  </style>
</head>
<body>
  <div class="page-content">
    <header class="app-header">
      <div class="container" style="display:flex;align-items:center;gap:12px">
        <a href="orders.html" style="color:#fff;font-size:1.4rem">&lsaquo;</a>
        <div class="logo">Suivi</div>
      </div>
    </header>

    <main class="container" style="padding-top:var(--space-5)">
      <div class="card" style="margin-bottom:var(--space-4)">
        <label class="form-label">Numero de commande ou de suivi</label>
        <div style="display:flex;gap:8px">
          <input type="text" id="q" class="form-input" placeholder="ABIT-..." />
          <button type="button" class="btn btn-primary" id="btn-search" style="min-width:90px">Voir</button>
        </div>
      </div>

      <div id="loading" style="text-align:center;padding:40px;display:none">
        <div class="spinner" style="margin:0 auto"></div>
      </div>

      <div id="result" style="display:none">
        <div class="card" style="margin-bottom:var(--space-4)">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div>
              <div id="order-num" style="font-weight:700;font-size:1.1rem"></div>
              <div id="order-date" style="font-size:0.8rem;color:var(--abit-gray-400);margin-top:2px"></div>
            </div>
            <span class="badge badge-info" id="order-status"></span>
          </div>
          <div id="order-total" style="margin-top:10px;font-weight:700;color:var(--abit-green)"></div>
          <div id="order-items" style="font-size:0.85rem;color:var(--abit-gray-600);margin-top:6px"></div>
          <div id="tracking-code" style="font-size:0.85rem;margin-top:8px;display:none"></div>
        </div>

        <div class="card" id="timeline"></div>
      </div>

      <div id="empty" class="empty-state" style="display:none">
        <p>Aucun suivi trouve.</p>
      </div>
    </main>
  </div>

  <nav class="bottom-nav">
    <a href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Accueil
    </a>
    <a href="exchange.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16V4M7 4L3 8M7 4l4 4M17 8v12M17 20l4-4M17 20l-4-4"/></svg>
      Echange
    </a>
    <a href="shop.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
      Boutique
    </a>
    <a href="orders.html" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Commandes
    </a>
    <a href="profile.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profil
    </a>
  </nav>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const cfg = {
      apiKey: "AIzaSyDHSNdIiEsg7XlfgRA3YGZuVVNkkJShnXQ",
      authDomain: "abit-d927a.firebaseapp.com",
      projectId: "abit-d927a",
      storageBucket: "abit-d927a.firebasestorage.app",
      messagingSenderId: "254745714667",
      appId: "1:254745714667:web:0ff4451bdd63d680aa03ae"
    };
    const app = initializeApp(cfg);
    const db = getFirestore(app);

    var STEPS = [
      { key: "received", label: "Commande recue" },
      { key: "confirmed", label: "Confirmee" },
      { key: "sourcing", label: "Approvisionnement Chine" },
      { key: "shipped", label: "Expediee" },
      { key: "in_transit", label: "En transit" },
      { key: "arrived_sn", label: "Arrivee au Senegal" },
      { key: "delivering", label: "En livraison" },
      { key: "delivered", label: "Livree" }
    ];
    var LABELS = {
      received: "Recue", pending_payment: "Paiement a confirmer", confirmed: "Confirmee",
      sourcing: "Approvisionnement", shipped: "Expediee", in_transit: "En transit",
      arrived_sn: "Au Senegal", delivering: "Livraison", delivered: "Livree",
      cancelled: "Annulee", refused: "Refusee"
    };

    function stepIndex(status) {
      var i = STEPS.findIndex(function (s) { return s.key === status; });
      return i < 0 ? 0 : i;
    }

    function renderOrder(o) {
      document.getElementById("order-num").textContent = o.orderNumber || o.id.slice(0, 10).toUpperCase();
      document.getElementById("order-status").textContent = LABELS[o.status] || o.status || "Recue";
      document.getElementById("order-total").textContent =
        o.totalXof != null ? Number(o.totalXof).toLocaleString("fr-FR") + " XOF" : "";
      var itemsTxt = "";
      if (Array.isArray(o.items)) {
        itemsTxt = o.items.map(function (it) { return (it.qty || 1) + " x " + (it.name || "Article"); }).join(", ");
      }
      document.getElementById("order-items").textContent = itemsTxt;
      var d = o.createdAt && o.createdAt.toDate ? o.createdAt.toDate() : null;
      document.getElementById("order-date").textContent = d ? d.toLocaleDateString("fr-FR") : "";
      var tc = document.getElementById("tracking-code");
      if (o.trackingCode) {
        tc.style.display = "block";
        tc.textContent = "N° suivi : " + o.trackingCode;
      } else tc.style.display = "none";

      var tl = document.getElementById("timeline");
      tl.innerHTML = "";
      var cur = stepIndex(o.status || "received");
      if (o.status === "cancelled" || o.status === "refused") {
        var p = document.createElement("p");
        p.textContent = LABELS[o.status];
        p.style.fontWeight = "600";
        tl.appendChild(p);
      } else {
        STEPS.forEach(function (s, i) {
          var row = document.createElement("div");
          row.className = "step" + (i < cur ? " done" : "") + (i === cur ? " current" : "");
          var col = document.createElement("div");
          col.className = "step-col";
          var dot = document.createElement("div");
          dot.className = "dot";
          col.appendChild(dot);
          if (i < STEPS.length - 1) {
            var line = document.createElement("div");
            line.className = "line";
            line.style.background = i < cur ? "var(--abit-green)" : "var(--abit-gray-200)";
            col.appendChild(line);
          }
          var lab = document.createElement("div");
          lab.style.paddingBottom = "16px";
          lab.style.fontSize = "0.9rem";
          lab.style.fontWeight = i === cur ? "700" : "500";
          lab.textContent = s.label;
          row.appendChild(col);
          row.appendChild(lab);
          tl.appendChild(row);
        });
      }
      document.getElementById("result").style.display = "block";
      document.getElementById("empty").style.display = "none";
    }

    async function search(q) {
      document.getElementById("loading").style.display = "block";
      document.getElementById("result").style.display = "none";
      document.getElementById("empty").style.display = "none";
      try {
        var found = null;
        try {
          var snap = await getDoc(doc(db, "orders", q));
          if (snap.exists()) found = Object.assign({ id: snap.id }, snap.data());
        } catch (e) {}
        if (!found) {
          var all = await getDocs(collection(db, "orders"));
          all.forEach(function (d) {
            var data = d.data();
            if (!found && (data.orderNumber === q || data.trackingCode === q || d.id === q)) {
              found = Object.assign({ id: d.id }, data);
            }
          });
        }
        document.getElementById("loading").style.display = "none";
        if (found) renderOrder(found);
        else document.getElementById("empty").style.display = "block";
      } catch (e) {
        document.getElementById("loading").style.display = "none";
        document.getElementById("empty").style.display = "block";
      }
    }

    document.getElementById("btn-search").addEventListener("click", function () {
      var q = document.getElementById("q").value.trim();
      if (q) search(q);
    });

    var params = new URLSearchParams(location.search);
    var preset = params.get("order") || params.get("id") || "";
    if (preset) {
      document.getElementById("q").value = preset;
      search(preset);
    }
  </script>
</body>
</html>
