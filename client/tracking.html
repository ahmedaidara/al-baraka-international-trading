<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0B3D2E" />
  <title>ABIT — Suivi colis</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/design-system.css" />
  <style>
    .timeline { position: relative; padding-left: 28px; }
    .timeline::before {
      content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px;
      width: 2px; background: var(--abit-gray-200);
    }
    .tl-item { position: relative; margin-bottom: var(--space-5); }
    .tl-item::before {
      content: ""; position: absolute; left: -24px; top: 4px;
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--abit-gray-200); border: 2px solid white;
    }
    .tl-item.done::before { background: var(--abit-green); }
    .tl-item.active::before { background: var(--abit-gold); box-shadow: 0 0 0 3px rgba(201,162,39,.3); }
  </style>
</head>
<body>
  <div class="page-content">
    <header class="app-header">
      <div class="container" style="display:flex;align-items:center;gap:var(--space-3)">
        <a href="orders.html" style="color:white">←</a>
        <div class="logo">Suivi colis</div>
      </div>
    </header>
    <main class="container" style="padding-top:var(--space-5)">
      <div class="card" style="margin-bottom:var(--space-5)">
        <div class="form-group" style="margin-bottom:var(--space-3)">
          <label class="form-label">Numéro de suivi ou commande</label>
          <input type="text" id="track-input" class="form-input" placeholder="ABIT-TRK-… ou ABIT-CMD-…" />
        </div>
        <button class="btn btn-primary btn-block" id="btn-track">Rechercher</button>
      </div>
      <div id="result" style="display:none">
        <div class="card" style="margin-bottom:var(--space-4)">
          <div style="font-size:0.75rem;color:var(--abit-gray-400)">Numéro</div>
          <div id="track-num" style="font-weight:700;font-size:1.1rem"></div>
          <div id="track-status" style="margin-top:var(--space-2)"></div>
        </div>
        <div class="card">
          <h3 style="font-size:0.95rem;font-weight:600;margin-bottom:var(--space-4)">Chronologie</h3>
          <div class="timeline" id="timeline"></div>
        </div>
      </div>
      <div id="not-found" class="empty-state" style="display:none">
        <p>Aucun suivi trouvé pour ce numéro.</p>
        <p style="font-size:0.85rem;margin-top:var(--space-2)">Les informations publiques sont limitées. Connectez-vous pour plus de détails.</p>
      </div>
    </main>
  </div>
  <nav class="bottom-nav">
    <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Accueil</a>
    <a href="exchange.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16V4M7 4L3 8M7 4l4 4M17 8v12M17 20l4-4M17 20l-4-4"/></svg>Échange</a>
    <a href="shop.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>Boutique</a>
    <a href="orders.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Commandes</a>
    <a href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profil</a>
  </nav>
  <script type="module">
    import { db } from "./js/firebase-init.js";
    import { collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const steps = [
      "Commande confirmée", "Approvisionnement", "Préparation",
      "Expédition Chine", "Transit international", "Arrivée Sénégal",
      "Livraison locale", "Livré"
    ];

    document.getElementById("btn-track").addEventListener("click", async () => {
      const code = document.getElementById("track-input").value.trim();
      if (!code) return;
      document.getElementById("result").style.display = "none";
      document.getElementById("not-found").style.display = "none";
      // Recherche simplifiée : par trackingNumber dans orders (ou trackingEvents)
      try {
        const q = query(collection(db, "orders"), where("trackingNumber", "==", code));
        const snap = await getDocs(q);
        if (snap.empty) {
          document.getElementById("not-found").style.display = "block";
          return;
        }
        const order = snap.docs[0].data();
        document.getElementById("track-num").textContent = order.trackingNumber || code;
        document.getElementById("track-status").innerHTML =
          `<span class="badge badge-info">${order.status || "en cours"}</span>`;
        const tl = document.getElementById("timeline");
        tl.innerHTML = "";
        const current = order.trackingStep || 0;
        steps.forEach((label, i) => {
          const div = document.createElement("div");
          div.className = "tl-item" + (i < current ? " done" : i === current ? " active" : "");
          div.innerHTML = `<div style="font-weight:500;font-size:0.9rem">${label}</div>`;
          tl.appendChild(div);
        });
        document.getElementById("result").style.display = "block";
      } catch {
        document.getElementById("not-found").style.display = "block";
      }
    });

    // Auto-load from ?order=
    const params = new URLSearchParams(location.search);
    if (params.get("order")) {
      document.getElementById("track-input").value = params.get("order");
    }
  </script>
</body>
</html>
