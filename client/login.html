<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0B3D2E" />
  <title>ABIT — Connexion</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/css/design-system.css" />
</head>
<body>
  <div class="page-content" style="display:flex;flex-direction:column;min-height:100dvh">
    <header class="app-header">
      <div class="container" style="display:flex;align-items:center;gap:var(--space-3)">
        <a href="index.html" style="color:white;font-size:1.25rem">←</a>
        <div class="logo">ABIT</div>
      </div>
    </header>

    <main class="container" style="flex:1;padding-top:var(--space-8)">
      <h1 style="font-size:1.5rem;font-weight:700;margin-bottom:var(--space-2)">Connexion</h1>
      <p style="color:var(--abit-gray-600);margin-bottom:var(--space-6)">Accédez à vos échanges et commandes.</p>

      <div class="card">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="form-input" placeholder="votre@email.com" autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label">Mot de passe</label>
          <input type="password" id="password" class="form-input" autocomplete="current-password" />
        </div>
        <button class="btn btn-primary btn-block" id="btn-login">Se connecter</button>
        <p id="error" style="color:var(--status-error);font-size:0.85rem;margin-top:var(--space-3);display:none"></p>
      </div>

      <p style="text-align:center;margin-top:var(--space-6);font-size:0.9rem">
        Pas encore de compte ? <a href="register.html" style="color:var(--abit-green);font-weight:600">S’inscrire</a>
      </p>
      <p style="text-align:center;margin-top:var(--space-3);font-size:0.85rem">
        <a href="#" id="forgot" style="color:var(--abit-gray-400)">Mot de passe oublié ?</a>
      </p>
    </main>
  </div>

  <script type="module">
    import { auth, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged } from "../shared/js/firebase-init.js";

    onAuthStateChanged(auth, (user) => {
      if (user) window.location.href = "index.html";
    });

    document.getElementById("btn-login").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const err = document.getElementById("error");
      err.style.display = "none";
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (e) {
        err.textContent = "Email ou mot de passe incorrect.";
        err.style.display = "block";
      }
    });

    document.getElementById("forgot").addEventListener("click", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      if (!email) {
        alert("Entrez d’abord votre email.");
        return;
      }
      try {
        await sendPasswordResetEmail(auth, email);
        alert("Un email de réinitialisation a été envoyé.");
      } catch (err) {
        alert("Impossible d’envoyer l’email. Vérifiez l’adresse.");
      }
    });
  </script>
</body>
</html>
