<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0B3D2E" />
  <title>ABIT — Profil</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/design-system.css" />
</head>
<body>
  <div class="page-content">
    <header class="app-header">
      <div class="container">
        <div class="logo">Mon compte</div>
      </div>
    </header>
    <main class="container" style="padding-top:var(--space-5)">
      <div id="guest" style="display:none">
        <div class="card" style="text-align:center;padding:var(--space-8)">
          <p style="margin-bottom:var(--space-4);color:var(--abit-gray-600)">Connectez-vous pour gérer votre profil et vos opérations.</p>
          <a href="login.html" class="btn btn-primary">Se connecter</a>
          <p style="margin-top:var(--space-4);font-size:0.9rem"><a href="register.html" style="color:var(--abit-green)">Créer un compte</a></p>
        </div>
      </div>
      <div id="user-panel" style="display:none">
        <div class="card" style="margin-bottom:var(--space-4)">
          <div style="font-size:0.75rem;color:var(--abit-gray-400);margin-bottom:4px">Compte</div>
          <div id="user-name" style="font-weight:600;font-size:1.1rem"></div>
          <div id="user-email" style="font-size:0.875rem;color:var(--abit-gray-600);margin-top:2px"></div>
          <div id="user-phone" style="font-size:0.875rem;color:var(--abit-gray-600);margin-top:2px"></div>
        </div>
        <div class="card" style="padding:0;overflow:hidden;margin-bottom:var(--space-4)">
          <a href="orders.html" style="display:block;padding:var(--space-4);border-bottom:1px solid var(--abit-gray-100)">Mes commandes</a>
          <a href="exchange.html" style="display:block;padding:var(--space-4);border-bottom:1px solid var(--abit-gray-100)">Mes échanges</a>
          <a href="tracking.html" style="display:block;padding:var(--space-4)">Suivre un colis</a>
        </div>
        <button class="btn btn-outline btn-block" id="btn-logout" style="color:var(--status-error);border-color:var(--status-error)">Déconnexion</button>
      </div>
    </main>
  </div>
  <nav class="bottom-nav">
    <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Accueil</a>
    <a href="exchange.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16V4M7 4L3 8M7 4l4 4M17 8v12M17 20l4-4M17 20l-4-4"/></svg>Échange</a>
    <a href="shop.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>Boutique</a>
    <a href="orders.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Commandes</a>
    <a href="profile.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profil</a>
  </nav>
  <script type="module">
    import { auth, onAuthStateChanged, signOut, getUserProfile } from "./js/firebase-init.js";
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        document.getElementById("guest").style.display = "block";
        document.getElementById("user-panel").style.display = "none";
        return;
      }
      document.getElementById("guest").style.display = "none";
      document.getElementById("user-panel").style.display = "block";
      const profile = await getUserProfile(user.uid);
      document.getElementById("user-name").textContent = profile?.displayName || "Client ABIT";
      document.getElementById("user-email").textContent = user.email || "";
      document.getElementById("user-phone").textContent = profile?.phone || "";
    });
    document.getElementById("btn-logout").addEventListener("click", () => signOut(auth));
  </script>
</body>
</html>
