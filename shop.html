<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0B3D2E" />
  <title>ABIT — Boutique</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/design-system.css" />
  <style>
    .search-wrap { position: relative; margin-bottom: var(--space-4); }
    .search-wrap input { padding-left: 2.75rem; }
    .search-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--abit-gray-400); pointer-events: none;
    }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: var(--space-4); -webkit-overflow-scrolling: touch; }
    .chip {
      flex-shrink: 0; padding: 8px 14px; border-radius: var(--radius-full);
      font-size: 0.8rem; font-weight: 600; background: white;
      border: 1px solid var(--abit-gray-200); color: var(--abit-gray-600);
    }
    .chip.active { background: var(--abit-green); color: white; border-color: var(--abit-green); }
    .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
    .product-card {
      background: white; border-radius: var(--radius-lg); overflow: hidden;
      border: 1px solid var(--abit-gray-100); box-shadow: var(--shadow-sm);
      display: flex; flex-direction: column;
    }
    .product-card .thumb {
      aspect-ratio: 1; background: linear-gradient(145deg, #F1F4F3, #E5EAE8);
      display: flex; align-items: center; justify-content: center;
      color: var(--abit-gray-400); font-size: 0.75rem; position: relative;
    }
    .product-card .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .product-card .body { padding: var(--space-3); flex: 1; display: flex; flex-direction: column; }
    .product-card .name {
      font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .product-card .price { font-size: 0.95rem; font-weight: 700; color: var(--abit-green); margin-top: auto; }
    .product-card .meta { font-size: 0.7rem; color: var(--abit-gray-400); margin-top: 4px; }
    .cart-badge {
      background: var(--abit-gold); color: var(--abit-green-dark);
      font-size: 0.7rem; font-weight: 700; min-width: 18px; height: 18px;
      border-radius: 9px; display: inline-flex; align-items: center; justify-content: center;
      padding: 0 5px; margin-left: 4px;
    }
  </style>
</head>
<body>
  <div class="page-content">
    <header class="app-header">
      <div class="container" style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div class="logo">Boutique</div>
          <p style="font-size:0.8rem;opacity:0.85;margin-top:2px">Sélection Chine · livraison Sénégal</p>
        </div>
        <a href="cart.html" style="color:white;font-size:0.875rem;font-weight:500;display:flex;align-items:center">
          Panier<span class="cart-badge" id="cart-count" style="display:none">0</span>
        </a>
      </div>
    </header>

    <main class="container" style="padding-top:var(--space-4)">
      <div class="search-wrap">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="search" id="search" class="form-input" placeholder="Rechercher un produit…" />
      </div>

      <div class="chips" id="chips">
        <button type="button" class="chip active" data-cat="">Tout</button>
      </div>

      <div id="loading" style="text-align:center;padding:var(--space-10)">
        <div class="spinner" style="margin:0 auto"></div>
        <p style="margin-top:var(--space-3);font-size:0.85rem;color:var(--abit-gray-400)">Chargement du catalogue…</p>
      </div>

      <div id="list" class="product-grid" style="display:none"></div>

      <div id="empty" class="empty-state" style="display:none">
        <p style="font-size:1rem;font-weight:600;color:var(--abit-gray-600)">Aucun produit pour le moment</p>
        <p style="font-size:0.85rem;margin-top:var(--space-2);max-width:260px;margin-left:auto;margin-right:auto">
          Les articles publiés depuis l’administration apparaissent ici automatiquement.
        </p>
      </div>
    </main>
  </div>

  <nav class="bottom-nav">
    <a href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Accueil
    </a>
    <a href="exchange.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16V4M7 4L3 8M7 4l4 4M17 8v12M17 20l4-4M17 20l-4-4"/></svg>
      Échange
    </a>
    <a href="shop.html" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
      Boutique
    </a>
    <a href="orders.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Commandes
    </a>
    <a href="profile.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profil
    </a>
  </nav>

  <script type="module">
    import { db } from "./js/firebase-init.js";
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const listEl = document.getElementById("list");
    const emptyEl = document.getElementById("empty");
    const loadingEl = document.getElementById("loading");
    const chipsEl = document.getElementById("chips");
    let products = [];
    let activeCat = "";

    function cartCount() {
      try {
        const cart = JSON.parse(localStorage.getItem("abit_cart") || "[]");
        const n = cart.reduce((s, i) => s + (i.qty || 1), 0);
        const badge = document.getElementById("cart-count");
        if (n > 0) { badge.style.display = "inline-flex"; badge.textContent = String(n); }
      } catch {}
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function buildChips() {
      const cats = [...new Set(products.map(p => p.category).filter(Boolean))];
      cats.forEach(cat => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip";
        btn.dataset.cat = cat;
        btn.textContent = cat;
        btn.addEventListener("click", () => {
          activeCat = cat;
          chipsEl.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c.dataset.cat === cat));
          applyFilter();
        });
        chipsEl.appendChild(btn);
      });
      chipsEl.querySelector('[data-cat=""]')?.addEventListener("click", () => {
        activeCat = "";
        chipsEl.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c.dataset.cat === ""));
        applyFilter();
      });
    }

    function applyFilter() {
      const q = document.getElementById("search").value.toLowerCase().trim();
      let items = products;
      if (activeCat) items = items.filter(p => p.category === activeCat);
      if (q) items = items.filter(p =>
        (p.name || "").toLowerCase().includes(q) ||
        (p.description || "").toLowerCase().includes(q)
      );
      render(items);
    }

    function render(items) {
      listEl.innerHTML = "";
      if (!items.length) {
        listEl.style.display = "none";
        emptyEl.style.display = "block";
        return;
      }
      emptyEl.style.display = "none";
      listEl.style.display = "grid";
      items.forEach(p => {
        const a = document.createElement("a");
        a.href = `product.html?id=${encodeURIComponent(p.id)}`;
        a.className = "product-card";
        a.innerHTML = `
          <div class="thumb">${p.imageUrl
            ? `<img src="${escapeHtml(p.imageUrl)}" alt="" loading="lazy" />`
            : "Sans image"}</div>
          <div class="body">
            <div class="name">${escapeHtml(p.name || "Produit")}</div>
            <div class="price">${p.priceXof != null ? Number(p.priceXof).toLocaleString("fr-FR") + " XOF" : "—"}</div>
            ${p.deliveryDelay ? `<div class="meta">⏱ ${escapeHtml(p.deliveryDelay)}</div>` : ""}
          </div>`;
        listEl.appendChild(a);
      });
    }

    async function load() {
      try {
        const q = query(collection(db, "products"), where("published", "==", true));
        const snap = await getDocs(q);
        products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        products.sort((a, b) => (b.updatedAt?.toMillis?.() || 0) - (a.updatedAt?.toMillis?.() || 0));
        loadingEl.style.display = "none";
        buildChips();
        render(products);
      } catch (e) {
        console.warn(e);
        loadingEl.style.display = "none";
        emptyEl.style.display = "block";
        emptyEl.querySelector("p").textContent = "Catalogue indisponible";
      }
    }

    document.getElementById("search").addEventListener("input", applyFilter);
    cartCount();
    load();
  </script>
</body>
</html>
