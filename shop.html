<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0B3D2E" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>ABIT — Boutique</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/design-system.css?v=11" />
  <style>
    .search-wrap { position: relative; margin-bottom: var(--space-4); }
    .search-wrap input { padding-left: 2.75rem; }
    .search-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--abit-gray-400); pointer-events: none;
    }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: var(--space-4); -webkit-overflow-scrolling: touch; }
    .chip {
      flex-shrink: 0; padding: 8px 14px; border-radius: var(--radius-full);
      font-size: 0.8rem; font-weight: 600; background: white;
      border: 1px solid var(--abit-gray-200); color: var(--abit-gray-600);
    }
    .chip.active { background: var(--abit-green); color: white; border-color: var(--abit-green); }
    .product-grid {
      display: grid !important;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-3);
      min-height: 40px;
    }
    .product-card {
      background: #fff;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--abit-gray-100);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      min-height: 180px;
    }
    .product-card .thumb {
      aspect-ratio: 1;
      background: linear-gradient(145deg, #F1F4F3, #E5EAE8);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--abit-gray-400);
      font-size: 0.75rem;
    }
    .product-card .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .product-card .body { padding: var(--space-3); flex: 1; display: flex; flex-direction: column; }
    .product-card .name {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      line-height: 1.3;
      color: #2A322F;
    }
    .product-card .price {
      font-size: 0.95rem;
      font-weight: 700;
      color: #0B3D2E;
      margin-top: auto;
    }
    .product-card .meta { font-size: 0.7rem; color: var(--abit-gray-400); margin-top: 4px; }
    .status-bar {
      background: #E8F5F0;
      color: #0B3D2E;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      margin-bottom: var(--space-4);
      border: 1px solid #C6E4;
    }
    .cart-badge {
      background: var(--abit-gold); color: var(--abit-green-dark);
      font-size: 0.7rem; font-weight: 700; min-width: 18px; height: 18px;
      border-radius: 9px; display: inline-flex; align-items: center; justify-content: center;
      padding: 0 5px; margin-left: 4px;
    }
  </style>
</head>
<body>
  <div class="page-content">
    <header class="app-header">
      <div class="container" style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div class="logo">Boutique</div>
          <p style="font-size:0.8rem;opacity:0.85;margin-top:2px">Selection Chine · livraison Senegal</p>
        </div>
        <a href="cart.html" style="color:white;font-size:0.875rem;font-weight:500;display:flex;align-items:center">
          Panier<span class="cart-badge" id="cart-count" style="display:none">0</span>
        </a>
      </div>
    </header>

    <main class="container" style="padding-top:var(--space-4)">
      <div class="status-bar" id="status-bar">Connexion au catalogue...</div>

      <div class="search-wrap">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="search" id="search" class="form-input" placeholder="Rechercher un produit" />
      </div>

      <div class="chips" id="chips">
        <button type="button" class="chip active" data-cat="">Tout</button>
      </div>

      <div id="loading" style="text-align:center;padding:var(--space-10)">
        <div class="spinner" style="margin:0 auto"></div>
        <p style="margin-top:var(--space-3);font-size:0.85rem;color:var(--abit-gray-400)">Chargement du catalogue</p>
      </div>

      <div id="list" class="product-grid" style="display:none"></div>

      <div id="empty" class="empty-state" style="display:none">
        <p style="font-size:1rem;font-weight:600;color:var(--abit-gray-600)" id="empty-title">Aucun produit</p>
        <p style="font-size:0.85rem;margin-top:var(--space-2)" id="empty-sub">Ajoute un produit depuis l admin.</p>
      </div>
    </main>
  </div>

  <nav class="bottom-nav">
    <a href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Accueil
    </a>
    <a href="exchange.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16V4M7 4L3 8M7 4l4 4M17 8v12M17 20l4-4M17 20l-4-4"/></svg>
      Echange
    </a>
    <a href="shop.html" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
      Boutique
    </a>
    <a href="orders.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Commandes
    </a>
    <a href="profile.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profil
    </a>
  </nav>

  <script type="module">
    // Anti service-worker cache
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      });
    }

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDHSNdIiEsg7XlfgRA3YGZuVVNkkJShnXQ",
      authDomain: "abit-d927a.firebaseapp.com",
      projectId: "abit-d927a",
      storageBucket: "abit-d927a.firebasestorage.app",
      messagingSenderId: "254745714667",
      appId: "1:254745714667:web:0ff4451bdd63d680aa03ae",
      measurementId: "G-PXVPKT3M89"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const listEl = document.getElementById("list");
    const emptyEl = document.getElementById("empty");
    const loadingEl = document.getElementById("loading");
    const chipsEl = document.getElementById("chips");
    const statusBar = document.getElementById("status-bar");
    let products = [];
    let activeCat = "";

    function setStatus(text) {
      statusBar.textContent = text;
    }

    function cartCount() {
      try {
        const cart = JSON.parse(localStorage.getItem("abit_cart") || "[]");
        const n = cart.reduce(function (s, i) { return s + (i.qty || 1); }, 0);
        const badge = document.getElementById("cart-count");
        if (n > 0) {
          badge.style.display = "inline-flex";
          badge.textContent = String(n);
        }
      } catch (e) {}
    }

    function isPublished(p) {
      if (p.published === false || p.published === "false" || p.published === 0) return false;
      return true;
    }

    function buildChips() {
      var cats = [];
      products.forEach(function (p) {
        if (p.category && cats.indexOf(p.category) === -1) cats.push(p.category);
      });
      cats.forEach(function (cat) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip";
        btn.setAttribute("data-cat", cat);
        btn.textContent = cat;
        btn.addEventListener("click", function () {
          activeCat = cat;
          chipsEl.querySelectorAll(".chip").forEach(function (c) {
            c.classList.toggle("active", c.getAttribute("data-cat") === cat);
          });
          applyFilter();
        });
        chipsEl.appendChild(btn);
      });
      var allBtn = chipsEl.querySelector('[data-cat=""]');
      if (allBtn) {
        allBtn.addEventListener("click", function () {
          activeCat = "";
          chipsEl.querySelectorAll(".chip").forEach(function (c) {
            c.classList.toggle("active", c.getAttribute("data-cat") === "");
          });
          applyFilter();
        });
      }
    }

    function applyFilter() {
      var q = document.getElementById("search").value.toLowerCase().trim();
      var items = products.slice();
      if (activeCat) {
        items = items.filter(function (p) { return p.category === activeCat; });
      }
      if (q) {
        items = items.filter(function (p) {
          return (p.name || "").toLowerCase().indexOf(q) !== -1 ||
            (p.description || "").toLowerCase().indexOf(q) !== -1;
        });
      }
      render(items);
    }

    function render(items) {
      listEl.innerHTML = "";
      if (!items.length) {
        listEl.style.display = "none";
        emptyEl.style.display = "block";
        setStatus("Aucun produit pour ce filtre");
        return;
      }
      emptyEl.style.display = "none";
      listEl.style.display = "grid";
      setStatus(items.length + " produit(s) affiche(s)");

      items.forEach(function (p) {
        var a = document.createElement("a");
        a.href = "product.html?id=" + encodeURIComponent(p.id);
        a.className = "product-card";

        var thumb = document.createElement("div");
        thumb.className = "thumb";
        if (p.imageUrl) {
          var img = document.createElement("img");
          img.src = p.imageUrl;
          img.alt = p.name || "";
          img.loading = "lazy";
          thumb.appendChild(img);
        } else {
          thumb.textContent = "Sans image";
        }

        var body = document.createElement("div");
        body.className = "body";

        var nameEl = document.createElement("div");
        nameEl.className = "name";
        nameEl.textContent = p.name || "Produit";

        var priceEl = document.createElement("div");
        priceEl.className = "price";
        priceEl.textContent = p.priceXof != null
          ? Number(p.priceXof).toLocaleString("fr-FR") + " XOF"
          : "-";

        body.appendChild(nameEl);
        body.appendChild(priceEl);

        if (p.deliveryDelay) {
          var meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = String(p.deliveryDelay);
          body.appendChild(meta);
        }

        a.appendChild(thumb);
        a.appendChild(body);
        listEl.appendChild(a);
      });
    }

    function showEmpty(title, sub) {
      loadingEl.style.display = "none";
      listEl.style.display = "none";
      emptyEl.style.display = "block";
      document.getElementById("empty-title").textContent = title;
      document.getElementById("empty-sub").textContent = sub;
      setStatus(title);
    }

    async function load() {
      setStatus("Lecture Firebase (products)...");
      try {
        var snap = await getDocs(collection(db, "products"));
        var all = [];
        snap.forEach(function (d) {
          var data = d.data();
          data.id = d.id;
          all.push(data);
        });

        setStatus(all.length + " document(s) trouves dans products");

        products = all.filter(isPublished);

        products.sort(function (a, b) {
          var ta = (a.updatedAt && a.updatedAt.toMillis) ? a.updatedAt.toMillis() : 0;
          var tb = (b.updatedAt && b.updatedAt.toMillis) ? b.updatedAt.toMillis() : 0;
          return tb - ta;
        });

        loadingEl.style.display = "none";

        if (!products.length) {
          showEmpty(
            all.length ? "Produits non publies" : "Collection vide",
            all.length
              ? "Firestore a " + all.length + " produit(s) mais published=false."
              : "Aucun document dans la collection products."
          );
          return;
        }

        buildChips();
        render(products);
      } catch (e) {
        console.error("Boutique load error:", e);
        showEmpty(
          "Erreur Firebase",
          e && e.message ? String(e.message) : "Erreur inconnue"
        );
      }
    }

    document.getElementById("search").addEventListener("input", applyFilter);
    cartCount();
    load();

    setTimeout(function () {
      if (loadingEl.style.display !== "none") {
        showEmpty(
          "Timeout Firebase",
          "Pas de reponse apres 15s. Verifie regles Firestore et reseau."
        );
      }
    }, 15000);
  </script>
</body>
</html>
